<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Growth Island Admin</title>
    <style>
      * { box-sizing: border-box; }
      body {
        font-family: system-ui, sans-serif;
        background: #bfeaf5;
        color: #123253;
        margin: 0;
        padding: 20px;
      }
      h1 { margin: 0 0 8px; }
      .card {
        background: #fff;
        border: 2px solid #123253;
        border-radius: 16px;
        padding: 16px;
        margin: 12px 0;
        max-width: 1100px;
        box-shadow: 0 4px 0 #123253;
      }
      input, button, select {
        font: inherit;
        padding: 8px 12px;
        margin: 4px 4px 4px 0;
        border-radius: 10px;
        border: 2px solid #123253;
      }
      button {
        background: #0a66c2;
        color: #fff;
        font-weight: 800;
        cursor: pointer;
      }
      button.secondary { background: #fff; color: #123253; }
      button.danger { background: #c0392b; }
      button.ok { background: #1b9e4b; }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      th, td {
        border-bottom: 1px solid #dde8f2;
        padding: 8px 6px;
        text-align: left;
        vertical-align: top;
      }
      .muted { color: #5c7a99; font-weight: 700; }
      .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
      .stat {
        display: inline-block;
        background: #eaf4ff;
        border: 2px solid #123253;
        border-radius: 12px;
        padding: 10px 14px;
        margin: 4px;
        font-weight: 900;
        min-width: 100px;
      }
      .stat b { display: block; font-size: 22px; color: #0a66c2; }
      pre {
        background: #f2f8ff;
        border-radius: 12px;
        padding: 12px;
        overflow: auto;
        font-size: 12px;
      }
      .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 12px 0; }
      .tabs button { background: #fff; color: #123253; }
      .tabs button.on { background: #0a66c2; color: #fff; }
      .panel { display: none; }
      .panel.on { display: block; }
      .badge {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 999px;
        border: 2px solid #123253;
        font-size: 11px;
        font-weight: 900;
      }
      .badge.pending { background: #fff3d0; }
      .badge.approved { background: #e9fbee; }
      .badge.rejected { background: #ffe0e4; }
      .badge.banned { background: #ffd0d0; }
    </style>
  </head>
  <body>
    <h1>🏝️ Growth Island Admin</h1>
    <p class="muted">Server admin · requires <code>ADMIN_KEY</code> on Railway</p>

    <div class="card">
      <div class="row">
        <label>Admin key
          <input type="password" id="key" placeholder="ADMIN_KEY" style="min-width:280px" />
        </label>
        <button id="load" class="ok">Load dashboard</button>
        <button id="backup" class="secondary">Force backup</button>
      </div>
      <p class="muted" id="status">Paste ADMIN_KEY then Load.</p>
    </div>

    <div class="card" id="overview"></div>

    <div class="tabs">
      <button type="button" class="on" data-tab="users">Users</button>
      <button type="button" data-tab="sellers">Sellers</button>
      <button type="button" data-tab="analytics">Analytics</button>
      <button type="button" data-tab="chat">Chat log</button>
    </div>

    <div class="card panel on" id="panel-users"></div>
    <div class="card panel" id="panel-sellers"></div>
    <div class="card panel" id="panel-analytics"></div>
    <div class="card panel" id="panel-chat"></div>

    <script>
      const keyEl = document.getElementById('key');
      const st = document.getElementById('status');
      keyEl.value = localStorage.getItem('gi_admin_key') || '';

      async function api(path, opts = {}) {
        const key = keyEl.value.trim();
        localStorage.setItem('gi_admin_key', key);
        const r = await fetch(path, {
          ...opts,
          headers: {
            'Content-Type': 'application/json',
            'X-Admin-Key': key,
            ...(opts.headers || {}),
          },
        });
        const j = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(j.error || r.statusText || String(r.status));
        return j;
      }

      document.querySelectorAll('.tabs button').forEach((b) => {
        b.onclick = () => {
          document.querySelectorAll('.tabs button').forEach((x) => x.classList.remove('on'));
          document.querySelectorAll('.panel').forEach((x) => x.classList.remove('on'));
          b.classList.add('on');
          document.getElementById('panel-' + b.dataset.tab).classList.add('on');
        };
      });

      document.getElementById('backup').onclick = async () => {
        try {
          const r = await api('/api/admin/backup', { method: 'POST', body: '{}' });
          st.textContent = 'Backup OK · total backups: ' + r.backups;
          await loadAll();
        } catch (e) {
          st.textContent = e.message;
        }
      };

      async function loadAll() {
        st.textContent = 'Loading…';
        const o = await api('/api/admin/overview');
        document.getElementById('overview').innerHTML =
          '<h2>Overview</h2><div class="row">' +
          [
            ['Users', o.users],
            ['Online', o.online],
            ['Hooks today', o.hooksToday],
            ['Sellers pending', o.sellersPending],
            ['Events today', o.analyticsToday],
            ['Banned', o.banned],
            ['Backups', o.backups],
          ]
            .map(([k, v]) => `<div class="stat"><span class="muted">${k}</span><b>${v}</b></div>`)
            .join('') +
          '</div>';

        const u = await api('/api/admin/users');
        document.getElementById('panel-users').innerHTML =
          '<h2>Users (' + u.users.length + ')</h2>' +
          '<table><tr><th>Name</th><th>Email</th><th>Invite</th><th>Created</th><th>Status</th><th></th></tr>' +
          u.users
            .map(
              (x) =>
                `<tr>
                  <td>${esc(x.name)}</td>
                  <td>${esc(x.email)}</td>
                  <td><code>${esc(x.inviteCode || '')}</code></td>
                  <td>${x.createdAt ? new Date(x.createdAt).toLocaleString() : '—'}</td>
                  <td>${x.banned ? '<span class="badge banned">banned</span>' : 'ok'}</td>
                  <td>
                    ${x.banned
                      ? `<button class="secondary" data-unban="${x.id}">Unban</button>`
                      : `<button class="danger" data-ban="${x.id}">Ban</button>`}
                  </td>
                </tr>`
            )
            .join('') +
          '</table>';

        document.querySelectorAll('[data-ban]').forEach((b) => {
          b.onclick = async () => {
            if (!confirm('Ban this user?')) return;
            await api('/api/admin/ban', {
              method: 'POST',
              body: JSON.stringify({ userId: b.dataset.ban }),
            });
            await loadAll();
          };
        });
        document.querySelectorAll('[data-unban]').forEach((b) => {
          b.onclick = async () => {
            await api('/api/admin/unban', {
              method: 'POST',
              body: JSON.stringify({ userId: b.dataset.unban }),
            });
            await loadAll();
          };
        });

        const s = await api('/api/admin/sellers');
        document.getElementById('panel-sellers').innerHTML =
          '<h2>Seller submissions</h2>' +
          (s.sellers.length
            ? '<table><tr><th>Title</th><th>Price</th><th>Email</th><th>Status</th><th></th></tr>' +
              s.sellers
                .map(
                  (x) =>
                    `<tr>
                      <td>${esc(x.title)}<div class="muted">${esc(x.desc || '').slice(0, 80)}</div></td>
                      <td>${esc(String(x.price ?? ''))}</td>
                      <td>${esc(x.email || '')}</td>
                      <td><span class="badge ${esc(x.status)}">${esc(x.status)}</span></td>
                      <td>
                        <button class="ok" data-id="${x.id}" data-s="approved">Approve</button>
                        <button class="danger" data-id="${x.id}" data-s="rejected">Reject</button>
                        <button class="secondary" data-id="${x.id}" data-s="pending">Pending</button>
                      </td>
                    </tr>`
                )
                .join('') +
              '</table>'
            : '<p class="muted">No seller submissions yet.</p>');

        document.querySelectorAll('#panel-sellers button[data-id]').forEach((b) => {
          b.onclick = async () => {
            await api('/api/admin/sellers/' + b.dataset.id, {
              method: 'POST',
              body: JSON.stringify({ status: b.dataset.s }),
            });
            await loadAll();
          };
        });

        const a = await api('/api/admin/analytics');
        document.getElementById('panel-analytics').innerHTML =
          '<h2>Analytics · ' + esc(a.day) + '</h2>' +
          '<p class="muted">Total events today: <b>' + a.total + '</b></p>' +
          '<pre>' + esc(JSON.stringify(a.counts || {}, null, 2)) + '</pre>' +
          '<h3>Recent</h3><pre>' +
          esc(JSON.stringify((a.recent || []).slice(0, 30), null, 2)) +
          '</pre>';

        const c = await api('/api/admin/chat');
        document.getElementById('panel-chat').innerHTML =
          '<h2>Chat / hook log (latest 200)</h2>' +
          (c.chat?.length
            ? '<table><tr><th>When</th><th>User</th><th>Type</th><th>Text</th></tr>' +
              c.chat
                .map(
                  (x) =>
                    `<tr>
                      <td>${x.ts ? new Date(x.ts).toLocaleString() : '—'}</td>
                      <td>${esc(x.userId || x.name || '')}</td>
                      <td>${esc(x.kind || x.type || '')}</td>
                      <td>${esc(String(x.text || x.message || '').slice(0, 200))}</td>
                    </tr>`
                )
                .join('') +
              '</table>'
            : '<p class="muted">No chat log entries yet.</p>');

        st.textContent = 'OK · loaded ' + new Date().toLocaleTimeString();
      }

      function esc(s) {
        return String(s)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      document.getElementById('load').onclick = async () => {
        try {
          await loadAll();
        } catch (e) {
          st.textContent = 'Error: ' + e.message;
        }
      };

      if (keyEl.value) {
        // Auto-load if key saved
        document.getElementById('load').click();
      }
    </script>
  </body>
</html>
